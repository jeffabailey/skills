version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # All actions are pinned to specific SHA + version. gh-aw bumps have
    # repeatedly broken CI by silently changing path assumptions baked into the
    # hand-frozen workflow YAML — most recently the gh-aw 0.58.1 -> 0.62.0 bump
    # moved /opt/gh-aw/prompts/ to ${RUNNER_TEMP}/gh-aw/prompts/ (see GH Actions
    # runs 25275707144, 25287248940). Until the workflow is regenerated via
    # `gh aw compile`, hold gh-aw only; every other action keeps getting updates.
    ignore:
      - dependency-name: "github/gh-aw*"

  # Python dev dependencies (hypothesis, jsonschema, pytest, pytest-bdd) in uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
