[project]
name = "cartcalc"
version = "0.1.0"
description = "Tiny shopping-cart library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2"]

[project.scripts]
cartcalc = "cartcalc.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
]

[tool.importlinter]
root_package = "cartcalc"

[[tool.importlinter.contracts]]
name = "core does not depend on the CLI"
type = "forbidden"
source_modules = ["cartcalc.core"]
forbidden_modules = ["cartcalc.cli"]
